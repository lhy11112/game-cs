[package]
name = "game-cs"
version = "0.1.0"
edition = "2021"
authors = ["CS Game Team"]
description = "A CS-style tactical shooter game engine implemented in Rust"
default-run = "game-cs"

[[bin]]
name = "game-cs"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
